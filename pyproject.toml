[project]
name = "periodontite-microbioma-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.32.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "nbconvert>=7.17.2",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
